<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>走岔了 · 三个老男人的约定</title>
<meta name="theme-color" content="#141312">
<style>
:root{--bg:#141312;--card:#1f1e1c;--text:#efe7dc;--muted:#9a938b;--accent:#c98a58}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:2rem}
.wrap{max-width:420px;text-align:center}
.kicker{font-size:.75rem;letter-spacing:.28em;color:var(--muted);margin-bottom:1.2rem}
h1{font-size:1.9rem;font-weight:600;line-height:1.5;margin-bottom:1rem}
.sub{font-size:.95rem;line-height:1.9;color:var(--muted);margin-bottom:2.2rem}
.go{display:inline-block;padding:.85rem 2rem;border-radius:999px;border:1px solid rgba(201,138,88,.5);color:var(--accent);text-decoration:none;font-size:.95rem;letter-spacing:.04em;transition:background .2s,color .2s}
.go:hover{background:var(--accent);color:#17140f;border-color:var(--accent)}
.hint{margin-top:1.6rem;font-size:.78rem;color:#6a645d;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">404</div>
  <h1>这个路走偏了</h1>
  <p class="sub">你要找的页面不在这儿。<br>回主路书，从乌鲁木齐重新出发。</p>
  <a class="go" href="/beijiang-9day-travel/">回到路书</a>
  <p class="hint">如果刚才是从群里点进来的，链接可能断行了，整条重新复制一次。</p>
</div>
</body>
</html>
